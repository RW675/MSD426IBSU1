{% extends "base.html" %}

{% block title %}Add a guardian · Warrigal Park FC{% endblock %}

{% block content %}
    <header class="page-heading">
        <p class="eyebrow">OUR CLUB COMMUNITY</p>
        <h1>Add a guardian</h1>
        <p>Add a trusted contact for the players and families in our club.</p>
    </header>

    <section class="content-panel">
        {% if error %}
            <p class="alert" role="alert">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <div class="form-grid">
                <div class="form-field form-field-full">
                    <label for="guardian_name">Guardian name</label>
                    <input type="text" id="guardian_name" name="guardian_name" placeholder="Full name" required>
                </div>
                <div class="form-field">
                    <label for="mobile">Mobile</label>
                    <input type="tel" id="mobile" name="mobile" placeholder="04xx xxx xxx">
                </div>
                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com">
                </div>
                <div class="form-field">
                    <label for="relationship">Relationship to member</label>
                    <input type="text" id="relationship" name="relationship" placeholder="e.g. Parent">
                </div>
                <div class="form-field">
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address" placeholder="Street address">
                </div>
            </div>
            <div class="form-actions">
                <button type="submit">Save guardian <span aria-hidden="true">→</span></button>
                <a class="text-link" href="{{ url_for('guardian_list') }}">Cancel</a>
            </div>
        </form>
    </section>
{% endblock %}

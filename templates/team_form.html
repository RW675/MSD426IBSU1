<!DOCTYPE html>
<html>
<head>
    <title>Create Team - Warrigal Park FC</title>
</head>
<body>

    <h1>Create Team</h1>

    {% if error %}
        <p role="alert">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <label for="team_name">Team name:</label>
        <input
            type="text"
            id="team_name"
            name="team_name"
            required
        >
        <br><br>

        <label for="season">Season:</label>
        <input
            type="text"
            id="season"
            name="season"
            placeholder="2026"
            required
        >
        <br><br>

        <label for="age_group">Age group:</label>
        <input
            type="text"
            id="age_group"
            name="age_group"
            placeholder="U13"
            required
        >
        <br><br>

        <button type="submit">Create Team</button>

    </form>

</body>
</html>

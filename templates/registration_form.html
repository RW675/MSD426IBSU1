<!DOCTYPE html>
<html>
<head>
    <title>New Registration - Warrigal Park FC</title>
</head>
<body>
    <h1>New Member Registration</h1>
    <form method="POST">
        <label>Member name:
            <input type="text" name="member_name" required>
        </label><br><br>

        <label>Date of birth (YYYY-MM-DD):
            <input type="text" name="date_of_birth" required>
        </label><br><br>

        <label>Season:
            <input type="text" name="season" placeholder="2026" required>
        </label><br><br>

        <label>Age group:
            <input type="text" name="age_group" placeholder="U13" required>
        </label><br><br>

        <button type="submit">Register</button>
    </form>
</body>
</html>

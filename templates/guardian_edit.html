<!DOCTYPE html>
<html>
<head>
    <title>Edit Guardian - Warrigal Park FC</title>
</head>
<body>
    <h1>Edit Guardian</h1>

    {% if error %}
        <p role="alert">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <label for="guardian_name">Guardian name:</label>
        <input
            type="text"
            id="guardian_name"
            name="guardian_name"
            value="{{ guardian.name }}"
            required
        >
        <br><br>

        <label for="mobile">Mobile:</label>
        <input
            type="text"
            id="mobile"
            name="mobile"
            value="{{ guardian.mobile or '' }}"
        >
        <br><br>

        <label for="email">Email:</label>
        <input
            type="email"
            id="email"
            name="email"
            value="{{ guardian.email or '' }}"
        >
        <br><br>

        <label for="relationship">Relationship to member:</label>
        <input
            type="text"
            id="relationship"
            name="relationship"
            value="{{ guardian.relationship or '' }}"
        >
        <br><br>

        <label for="address">Address:</label>
        <input
            type="text"
            id="address"
            name="address"
            value="{{ guardian.address or '' }}"
        >
        <br><br>

        <p>
            Status:
            {% if guardian.is_active %}
                Active
            {% else %}
                Inactive
            {% endif %}
        </p>

        <button type="submit">
            Save Changes
        </button>

    </form>

    <p>
        <a href="{{ url_for('guardian_list') }}">
            Back to Guardian Records
        </a>
    </p>
</body>
</html>
